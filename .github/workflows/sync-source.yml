name: Source sync to destination

on:
  push:
    branches:
      - main

env:
  DESTINATION_REPO: destination
  DESTINATION_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DESTINATION_REPO }}
          token: ${{ secrets.DEST_REPO_PAT }}
          path: destination

      - name: Sync source to destination
        run: |
          BRANCH="sync-source-${GITHUB_SHA::7}"
          cd destination
          git checkout -B "$BRANCH"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            ../source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "sync: mirror source ${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository_owner }}/${{ env.DESTINATION_REPO }}" \
            --base "${{ env.DESTINATION_BRANCH }}" \
            --head "$BRANCH" \
            --title "Sync from source" \
            --body "Automated sync from source repo" \
            || echo "PR already exists or no changes"
