name: Source sync to destination

on:
  push:
    branches:
      - main

env:
  DESTINATION_REPO: destination
  DESTINATION_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DESTINATION_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: destination

      - name: Sync source to destination
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            source/ destination/

      - name: Commit and push changes to destination
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "sync: mirror source ${{ github.sha }}"
          git push origin ${{ env.DESTINATION_BRANCH }}
